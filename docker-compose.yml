services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://scrumbot:scrumbot@postgres:5432/scrumbot
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scrumbot
      POSTGRES_PASSWORD: scrumbot
      POSTGRES_DB: scrumbot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrumbot -d scrumbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
